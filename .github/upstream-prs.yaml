# Upstream pull requests (chris-mc1/homeconnect_local_hass) for the upstream tracker
# (.github/workflows/upstream-tracker.yaml). Listed PRs are left off the tracking issue.

# Upstream PRs closed or merged before this date are ignored.
since: 2026-10-14

# PRs by these authors are never tracked. Bots are always skipped.
ignore_authors:
  - vemboy200

# Already in the fork. A merged fork PR whose description says "Ported from
# chris-mc1/homeconnect_local_hass#123" counts too, so it doesn't need a line here.
ported:
  387: Hood fan state and turn off (the fork's fan has its own fixes)
  391: Hood start-only programs
  490: Connect retry backoff (the fork already backs off between reconnects)
  495: Backoff for unreachable appliances (the fork already backs off between reconnects)
  498: Light switched on before brightness and color temperature (the fork does this since upstream #477)
  499: Select programs without the current option set (the fork's select_program does this)
  503: Missing washer and dryer entities (fork #176)
  505: Consumption and laundry load sensors (fork #175)
  508: Duplicate entity names in translations (fork #174)
  512: Oven meat probe target temperature (fork #177)
  518: Unsigned WiFi signal strength (the fork reads the signal from /ni/info instead)
  523: Connection status and meat probe binary sensors (already in the fork)
  526: Open Door button (the fridge's Open door button already covers any appliance)

# Not wanted in the fork, with the reason. The tracker proposes new lines here (on the
# upstream-tracker/exclusions branch) for PRs closed upstream, or closed in the fork,
# without being merged for more than a day.
excluded:
  278: Remaining program time as a timestamp sensor (declined)
  460: Version 2 config entry setup fixes (upstream's setup path, which the fork doesn't use)
  530: "fix: keep controls available during transient read-only access (closed upstream on 2026-10-17)"
