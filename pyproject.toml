[project]
version = "1.7.0"
name = "homeconnect_ws"
authors = [{ name = "chris-mc1" }, { name = "vemboy200" }]
description = "Home Connect Local for Homeassistant"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = ["home-disconnect==1.7.0b0"]

[project.urls]
Homepage = "https://github.com/vemboy200/homeconnect_local_hass"
Issues = "https://github.com/vemboy200/homeconnect_local_hass/issues"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "colorlog==6.12.0",
    "homeassistant==2026.8.2",
    "voluptuous-stubs==0.1.1",
    "pre-commit==4.6.2",
    "mypy==2.3.1",
    "prek==0.5.1",
]
lint = ["ruff==0.16.5"]
test = [
    "pytest-homeassistant-custom-component==0.13.356",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-aiohttp>=1.1.0",
    "coverage>=7.10.6",
    "pytest-cov>=7.0.0",
]

[tool.uv]
constraint-dependencies = ["cffi==2.0.0"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.14"
show_error_codes = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "custom_components.homeconnect_ws.*"
strict = true
warn_unreachable = true
